<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Fabian Aragón Arce — Computer Engineering Student">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb4e6"/>
      <stop offset=".6" stop-color="#a9dbf3"/>
      <stop offset="1" stop-color="#fbe3bf"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 64) scale(95)">
      <stop offset="0" stop-color="#fff4c2" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff4c2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="swordGlow">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="volc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b6f63"/>
      <stop offset=".35" stop-color="#4f7a57"/>
      <stop offset="1" stop-color="#3f6e4b"/>
    </linearGradient>
    <clipPath id="frame"><rect width="900" height="300" rx="14"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
      .sun { transform-origin: 120px 64px; animation: sun 5s ease-in-out infinite; }
      @keyframes sun { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
      .cloud { animation: drift linear infinite; }
      @keyframes drift { from { transform: translateX(-120px) } to { transform: translateX(1000px) } }
      .bird { animation: fly linear infinite; }
      @keyframes fly { 0% { transform: translate(0,0) } 50% { transform: translate(500px,-12px) } 100% { transform: translate(1000px,6px) } }
      .flapb { transform-box: fill-box; transform-origin: center; animation: flapb .5s ease-in-out infinite alternate; }
      @keyframes flapb { to { transform: scaleY(-.6) } }
      .bfly { animation: bfly ease-in-out infinite; }
      @keyframes bfly { 0%,100% { transform: translate(0,0) } 50% { transform: translate(var(--dx), -12px) } }
      .smoke { fill: #ffffff; opacity: 0; animation: smoke 9s ease-out infinite; }
      @keyframes smoke { 0% { opacity: 0; transform: translate(0,0) scale(.6) } 15% { opacity: .8 } 100% { opacity: 0; transform: translate(70px,-70px) scale(2.4) } }
      .fade { opacity: 0; animation: in 1s ease-out forwards; }
      .d1 { animation-delay: .2s } .d2 { animation-delay: .5s } .d3 { animation-delay: .8s }
      @keyframes in { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
      .kite { transform-origin: 845px 66px; animation: kite 5s ease-in-out infinite; }
      @keyframes kite { 0%,100% { transform: rotate(-4deg) } 50% { transform: rotate(4deg) translateY(-3px) } }
      .fairy { animation: fairy 16s ease-in-out infinite; }
      @keyframes fairy {
        0%,100% { transform: translate(0,0) } 15% { transform: translate(40px,-14px) }
        30% { transform: translate(90px,6px) } 45% { transform: translate(140px,-10px) }
        60% { transform: translate(100px,-26px) } 75% { transform: translate(50px,-4px) } 90% { transform: translate(14px,-18px) } }
      .wing { transform-box: fill-box; transform-origin: center; animation: flap .25s ease-in-out infinite alternate; }
      @keyframes flap { to { transform: scaleY(.35) } }
      .bwing { transform-box: fill-box; transform-origin: center; animation: bflap .3s ease-in-out infinite alternate; }
      @keyframes bflap { to { transform: scaleX(.3) } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="300" fill="url(#sky)"/>

    <!-- sun -->
    <circle cx="120" cy="64" r="95" fill="url(#sunGlow)"/>
    <circle cx="120" cy="64" r="24" fill="#ffd166" class="sun"/>

    <!-- clouds + birds -->
    <g><g transform="translate(40 40)"><g class="cloud" fill="#fff" opacity="0.95" style="animation-duration:70s;animation-delay:-0s"><circle cx="0.0" cy="0.0" r="16.2"/><circle cx="18.0" cy="-7.2" r="19.8"/><circle cx="39.6" cy="-1.8" r="16.2"/><circle cx="55.8" cy="3.6" r="11.7"/><circle cx="-14.4" cy="5.4" r="10.8"/><rect x="-16.2" y="0" width="77.4" height="12.6" rx="6.3"/></g></g><g transform="translate(250 30)"><g class="cloud" fill="#fff" opacity="0.8" style="animation-duration:90s;animation-delay:-30s"><circle cx="0.0" cy="0.0" r="10.8"/><circle cx="12.0" cy="-4.8" r="13.2"/><circle cx="26.4" cy="-1.2" r="10.8"/><circle cx="37.2" cy="2.4" r="7.8"/><circle cx="-9.6" cy="3.6" r="7.2"/><rect x="-10.8" y="0" width="51.6" height="8.4" rx="4.2"/></g></g><g transform="translate(560 45)"><g class="cloud" fill="#fff" opacity="0.9" style="animation-duration:80s;animation-delay:-10s"><circle cx="0.0" cy="0.0" r="13.5"/><circle cx="15.0" cy="-6.0" r="16.5"/><circle cx="33.0" cy="-1.5" r="13.5"/><circle cx="46.5" cy="3.0" r="9.8"/><circle cx="-12.0" cy="4.5" r="9.0"/><rect x="-13.5" y="0" width="64.5" height="10.5" rx="5.2"/></g></g><g transform="translate(760 95)"><g class="cloud" fill="#fff" opacity="0.75" style="animation-duration:95s;animation-delay:-50s"><circle cx="0.0" cy="0.0" r="9.9"/><circle cx="11.0" cy="-4.4" r="12.1"/><circle cx="24.2" cy="-1.1" r="9.9"/><circle cx="34.1" cy="2.2" r="7.2"/><circle cx="-8.8" cy="3.3" r="6.6"/><rect x="-9.9" y="0" width="47.3" height="7.7" rx="3.9"/></g></g><g transform="translate(-80 110)"><g class="cloud" fill="#fff" opacity="0.7" style="animation-duration:85s;animation-delay:-20s"><circle cx="0.0" cy="0.0" r="9.0"/><circle cx="10.0" cy="-4.0" r="11.0"/><circle cx="22.0" cy="-1.0" r="9.0"/><circle cx="31.0" cy="2.0" r="6.5"/><circle cx="-8.0" cy="3.0" r="6.0"/><rect x="-9.0" y="0" width="43.0" height="7.0" rx="3.5"/></g></g></g>
    <g><g transform="translate(-40 60)"><g class="bird" style="animation-duration:26s;animation-delay:-0s"><path class="flapb" d="M-6 0 Q-3 -4 0 0 Q3 -4 6 0" stroke="#2c4a5e" stroke-width="1.4" fill="none" stroke-linecap="round"/></g></g><g transform="translate(-60 72)"><g class="bird" style="animation-duration:26s;animation-delay:-1.2s"><path class="flapb" d="M-6 0 Q-3 -4 0 0 Q3 -4 6 0" stroke="#2c4a5e" stroke-width="1.4" fill="none" stroke-linecap="round"/></g></g><g transform="translate(-25 78)"><g class="bird" style="animation-duration:26s;animation-delay:-2.0s"><path class="flapb" d="M-6 0 Q-3 -4 0 0 Q3 -4 6 0" stroke="#2c4a5e" stroke-width="1.4" fill="none" stroke-linecap="round"/></g></g><g transform="translate(-80 40)"><g class="bird" style="animation-duration:34s;animation-delay:-12s"><path class="flapb" d="M-6 0 Q-3 -4 0 0 Q3 -4 6 0" stroke="#2c4a5e" stroke-width="1.4" fill="none" stroke-linecap="round"/></g></g></g>

    <!-- easter egg: three-triangle kite (day version of the constellation) -->
    <g class="kite">
      <path d="M845 30 L825 66 L865 66Z" fill="#f5c542" stroke="#b7862a" stroke-width=".8"/>
      <path d="M835 48 L855 48 L845 66Z" fill="#a9dbf3" stroke="#b7862a" stroke-width=".8"/>
      <path d="M845 66 Q835 88 851 106 Q861 120 849 138" stroke="#b7862a" stroke-width=".8" fill="none" opacity=".6"/>
    </g>

    <!-- far mountain range (hazy) -->
    <path d="M0 205 L60 180 L120 192 L190 160 L250 178 L320 150 L400 176 L470 158 L540 182 L600 168 L680 186 L760 160 L830 176 L900 165 L900 300 L0 300Z" fill="#8fb8cc"/>

    <!-- volcano smoke -->
    <g transform="translate(716 146)">
      <circle class="smoke" r="9"/>
      <circle class="smoke" r="8" style="animation-delay:3s"/>
      <circle class="smoke" r="10" style="animation-delay:6s"/>
    </g>

    <!-- volcano (Arenal-style cone, green slopes) -->
    <path d="M570 240 Q670 195 706 152 L716 147 L728 152 Q760 195 870 240Z" fill="url(#volc)"/>
    <path d="M706 152 L716 147 L728 152 L722 156 L711 156Z" fill="#5a5850"/>

    <!-- mid hills -->
    <path d="M0 238 Q90 205 180 226 T360 222 T560 236 T760 220 T900 230 L900 300 L0 300Z" fill="#4c9a5f"/>

    <!-- jungle front -->
    <path d="M0 262 Q40 248 80 258 Q120 244 170 256 Q220 246 260 260 Q310 250 360 262 Q420 252 470 264 Q530 252 590 262 Q650 250 710 260 Q770 248 830 258 Q870 252 900 256 L900 300 L0 300Z" fill="#2a6b40"/>
    <g fill="#1f5232">
      <path d="M118 262 Q122 225 132 196" stroke="#6b4a2b" stroke-width="4" fill="none"/>
      <path d="M132 196 Q110 186 92 196 Q112 190 132 198 Q118 176 104 172 Q124 178 134 196 Q140 176 156 170 Q144 182 136 197 Q158 186 174 194 Q154 192 134 199Z"/>
      <g transform="translate(-330 4)">
        <path d="M812 260 Q806 228 796 204" stroke="#6b4a2b" stroke-width="4" fill="none"/>
        <path d="M796 204 Q776 194 760 204 Q778 198 796 206 Q784 186 772 182 Q790 188 798 204 Q806 186 820 180 Q810 192 800 205 Q820 196 836 202 Q818 200 798 207Z"/>
      </g>
    </g>

    <!-- easter egg: sword resting in a stone pedestal -->
    <g transform="translate(268 0)">
      <ellipse cx="0" cy="206" rx="22" ry="20" fill="url(#swordGlow)" class="pulse"/>
      <path d="M-16 230 L-11 219 L11 219 L16 230Z" fill="#9aa3b2"/><path d="M-16 230 L16 230 L14 233 L-14 233Z" fill="#6f7888"/>
      <path d="M-11 219 L11 219 L9 216 L-9 216Z" fill="#c3cad6"/>
      <rect x="-1.4" y="196" width="2.8" height="21" fill="#eef4fb" stroke="#8aa0bf" stroke-width=".4"/>
      <path d="M-1.4 217 L0 220 L1.4 217Z" fill="#eef4fb"/>
      <rect x="-7" y="194" width="14" height="2.6" rx="1.2" fill="#3b5bbf"/>
      <rect x="-1.2" y="187" width="2.4" height="7" fill="#2f4a99"/>
      <circle cx="0" cy="186" r="2" fill="#f5c542"/>
    </g>

    <!-- butterflies -->
    <g><g transform="translate(455.9 276.1)"><g class="bfly" style="--dx:-18px;animation-duration:8.51s;animation-delay:-4.11s"><ellipse cx="-2.6" cy="0" rx="2.8" ry="3" fill="#f59e0b" class="bwing"/><ellipse cx="2.6" cy="0" rx="2.8" ry="3" fill="#f59e0b" class="bwing"/><rect x="-.5" y="-2.5" width="1" height="5" fill="#3b2a1a"/></g></g><g transform="translate(797.0 237.3)"><g class="bfly" style="--dx:11px;animation-duration:7.44s;animation-delay:-5.19s"><ellipse cx="-2.6" cy="0" rx="2.8" ry="3" fill="#2563eb" class="bwing"/><ellipse cx="2.6" cy="0" rx="2.8" ry="3" fill="#2563eb" class="bwing"/><rect x="-.5" y="-2.5" width="1" height="5" fill="#3b2a1a"/></g></g><g transform="translate(132.5 234.0)"><g class="bfly" style="--dx:18px;animation-duration:6.96s;animation-delay:-3.84s"><ellipse cx="-2.6" cy="0" rx="2.8" ry="3" fill="#f59e0b" class="bwing"/><ellipse cx="2.6" cy="0" rx="2.8" ry="3" fill="#f59e0b" class="bwing"/><rect x="-.5" y="-2.5" width="1" height="5" fill="#3b2a1a"/></g></g><g transform="translate(64.8 250.4)"><g class="bfly" style="--dx:-19px;animation-duration:5.82s;animation-delay:-0.53s"><ellipse cx="-2.6" cy="0" rx="2.8" ry="3" fill="#f59e0b" class="bwing"/><ellipse cx="2.6" cy="0" rx="2.8" ry="3" fill="#f59e0b" class="bwing"/><rect x="-.5" y="-2.5" width="1" height="5" fill="#3b2a1a"/></g></g><g transform="translate(109.3 241.0)"><g class="bfly" style="--dx:10px;animation-duration:5.52s;animation-delay:-3.38s"><ellipse cx="-2.6" cy="0" rx="2.8" ry="3" fill="#f472b6" class="bwing"/><ellipse cx="2.6" cy="0" rx="2.8" ry="3" fill="#f472b6" class="bwing"/><rect x="-.5" y="-2.5" width="1" height="5" fill="#3b2a1a"/></g></g><g transform="translate(613.9 265.8)"><g class="bfly" style="--dx:-13px;animation-duration:7.36s;animation-delay:-2.93s"><ellipse cx="-2.6" cy="0" rx="2.8" ry="3" fill="#38bdf8" class="bwing"/><ellipse cx="2.6" cy="0" rx="2.8" ry="3" fill="#38bdf8" class="bwing"/><rect x="-.5" y="-2.5" width="1" height="5" fill="#3b2a1a"/></g></g><g transform="translate(353.7 281.7)"><g class="bfly" style="--dx:21px;animation-duration:6.04s;animation-delay:-7.11s"><ellipse cx="-2.6" cy="0" rx="2.8" ry="3" fill="#38bdf8" class="bwing"/><ellipse cx="2.6" cy="0" rx="2.8" ry="3" fill="#38bdf8" class="bwing"/><rect x="-.5" y="-2.5" width="1" height="5" fill="#3b2a1a"/></g></g><g transform="translate(467.3 255.2)"><g class="bfly" style="--dx:21px;animation-duration:5.67s;animation-delay:-6.76s"><ellipse cx="-2.6" cy="0" rx="2.8" ry="3" fill="#f59e0b" class="bwing"/><ellipse cx="2.6" cy="0" rx="2.8" ry="3" fill="#f59e0b" class="bwing"/><rect x="-.5" y="-2.5" width="1" height="5" fill="#3b2a1a"/></g></g></g>

    <!-- easter egg: the fairy is still around -->
    <g transform="translate(400 214)">
      <g class="fairy">
        <ellipse cx="-3.2" cy="-2.5" rx="3.2" ry="1.8" fill="#ffffff" opacity=".85" class="wing"/>
        <ellipse cx="3.2" cy="-2.5" rx="3.2" ry="1.8" fill="#ffffff" opacity=".85" class="wing"/>
        <circle r="2.6" fill="#7dd3fc" style="filter: drop-shadow(0 0 3px #0ea5e9) drop-shadow(0 0 6px #38bdf8)"/>
      </g>
    </g>

    <!-- text -->
    <text x="450" y="70" text-anchor="middle" class="mono fade d1" font-size="12" letter-spacing="4" fill="#24506d">PURA VIDA · WELCOME TO MY GITHUB</text>
    <text x="450" y="118" text-anchor="middle" class="sans fade d2" font-size="42" font-weight="700" fill="#0d2536">Fabian Aragón Arce</text>
    <text x="450" y="150" text-anchor="middle" class="mono fade d3" font-size="14" fill="#24506d">&lt;computer engineering student /&gt;<tspan class="cursor" fill="#e0782f"> _</tspan></text>
  </g>
</svg>
