<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Fabian Aragon Arce — Computer Engineering Student">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1b2333" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="45%" r="45%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
      .fade { opacity: 0; animation: in .8s ease-out forwards; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .6s } .d4 { animation-delay: .85s }
      @keyframes in { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .bit { animation: flicker 3s ease-in-out infinite; }
      @keyframes flicker { 0%,100% { opacity: .15 } 50% { opacity: .55 } }
      .star { transform-origin: 735px 125px; animation: spin 14s linear infinite, pulse 3s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }
      @keyframes pulse { 0%,100% { opacity: .85 } 50% { opacity: 1 } }
    </style>
  </defs>

  <rect width="900" height="260" rx="14" fill="#0b0f17"/>
  <rect width="900" height="260" rx="14" fill="url(#grid)"/>
  <rect width="900" height="260" rx="14" fill="url(#glow)"/>

  <!-- binary column -->
  <g class="mono" font-size="12" fill="#22d3ee">
    <text x="28" y="56"  class="bit">0</text>
    <text x="28" y="76"  class="bit" style="animation-delay:.4s">1</text>
    <text x="28" y="96"  class="bit" style="animation-delay:.8s">1</text>
    <text x="28" y="116" class="bit" style="animation-delay:1.2s">0</text>
    <text x="28" y="136" class="bit" style="animation-delay:1.6s">1</text>
    <text x="28" y="156" class="bit" style="animation-delay:2s">0</text>
    <text x="28" y="176" class="bit" style="animation-delay:2.4s">1</text>
    <text x="28" y="196" class="bit" style="animation-delay:2.8s">1</text>
  </g>

  <text x="64" y="74" class="mono fade d1" font-size="13" letter-spacing="3" fill="#22d3ee">COMPUTER ENGINEERING STUDENT</text>
  <text x="62" y="126" class="sans fade d2" font-size="44" font-weight="700" fill="#e6edf3">Fabian Aragon Arce</text>
  <rect x="64" y="142" width="300" height="2" fill="url(#line)" class="fade d2"/>
  <text x="64" y="180" class="mono fade d3" font-size="14" fill="#8b949e">
    <tspan fill="#22d3ee">$</tspan> whoami <tspan fill="#c9d1d9">→ builder, learner, problem solver</tspan><tspan class="cursor" fill="#22d3ee"> ▍</tspan>
  </text>
  <text x="64" y="212" class="mono fade d4" font-size="12" fill="#6e7681">C · C++ · Python · Java · Linux · Git</text>

  <!-- four-point star -->
  <g class="star">
    <path d="M735 55 C740 110 750 120 805 125 C750 130 740 140 735 195 C730 140 720 130 665 125 C720 120 730 110 735 55Z" fill="#22d3ee"/>
    <path d="M735 85 C738 118 742 122 775 125 C742 128 738 132 735 165 C732 132 728 128 695 125 C728 122 732 118 735 85Z" fill="#a5f3fc"/>
  </g>
</svg>
